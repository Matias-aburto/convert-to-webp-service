# fly.toml app configuration file generated for webp-converter-old-paper-9258 on 2026-03-27T12:28:56-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'webp-service-convert'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  MAX_PIXELS = '50000000'
  MAX_UPLOAD_MB = '20'
  PORT = '8080'
  RATE_LIMIT_REQUESTS = '30'
  RATE_LIMIT_WINDOW_SECONDS = '60'
  REQUEST_TIMEOUT_SECONDS = '60'
  STATIC_ASSET_VERSION = '2'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
